<div class="modal-container">
  <div class="modal-header">
    <span class="modal-title">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      </svg>
      Editar perfil
    </span>
    <button class="close-btn" (click)="close()">✕</button>
  </div>
  <div class="modal-body">
    @if (!modifyResult && !isLoading && !errorMsg) {
      <div class="mb-3">
        <label class="section-label">NOMBRE DE USUARIO</label>
        <input
          type="text"
          class="form-input"
          [placeholder]="data.username"
          [(ngModel)]="newUserName"
        />
      </div>

      <div class="mb-3">
        <label class="section-label">CORREO ELECTRÓNICO</label>
        <input
          type="email"
          class="form-input"
          [placeholder]="data.userEmail"
          [(ngModel)]="newUserEmail"
        />
      </div>

      <div class="mb-3">
        <label class="section-label">NUEVA CONTRASEÑA</label>
        <input
          type="password"
          class="form-input"
          placeholder="••••••••"
          [(ngModel)]="newPassword"
        />
      </div>

      <div class="modal-footer">
        <button class="generate-btn" (click)="modifyValues()" >Guardar cambios</button>
      </div>
    }
    @if (isLoading) {
      <div class="loading">
        <div class="spinner"></div>
        <p>Guardando cambios...</p>
      </div>
    }
    @if (modifyResult && !isLoading) {
      <div class="success">
        <p>¡Perfil actualizado correctamente!</p>
        <button class="generate-btn" (click)="close()">Cerrar</button>
      </div>
    }

    @if (errorMsg && !isLoading) {
      <div class="error">
        <p>{{ errorMsg }}</p>
        <button class="retry-btn" (click)="modifyValues()">Reintentar</button>
      </div>
    }
  </div>
</div>
