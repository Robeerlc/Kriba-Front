<div class="article-card">
  <div class="article-content">
    <div class="article-header">

      <div class="header-left">

        @if (!isSaved) {
          <span>{{ article.category.toUpperCase() }} | <strong>{{ article.source?.name.toUpperCase()  }}</strong></span>
          <button class="btn-subscribe" (click)="subscribe()">
            @if (article.isSubscribed) {
              🔔 Suscribito         
            } @else {
              🔕 No subscrito
            }
          </button>
        }

      </div>
      <div class="article-date">
        {{ article.publishedAt | date }}
      </div>
    </div>

    <h2 class="article-title">{{ article.title }}</h2>
    <p class="article-description">{{ article.description }}</p>

    <div class="article-actions">
        <button class="btn-heart" (click)="like()">
          @if (article.isFavorite) {
            <span class="heart-icon active">♥</span>
          } @else {
            <span class="heart-icon">♡</span>
          }
        </button>
      

      <button class="read-full-btn"  (click)="onSummarize(article)">
        Resumen IA
      </button>
      <button class="read-full-btn" (click)="onReadFull($event)" (click)="sendInteracionClick()">
        Leer más →
      </button>   

    </div>
  </div>

    <div class="article-image-container">
      <img [src]="article.image" 
           [alt]="article.title" 
           (error)="imageError($event)"
           class="article-image" />
    </div>

</div>
