<div class="d-flex">
  <div>
    <lateralBar></lateralBar>
  </div>

  <div class="flex-grow-1 p-4">
      <div class="profile-header mb-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
          <div class="avatar-circle"></div>
          <div class="profile-info">
            <h2 class="fw-bold mb-0">{{ userName() }}</h2>
            <span class="text-muted">{{ userEmail() }}</span>
          </div>
        </div>
        <button class="btn btn-danger btn-sm" (click)="deleteUser()">Eliminar cuenta</button>
      </div>


    <div class="row gap-3">
      <div class="col-md-5">
        <div class="card p-4">
          <h5 class="fw-bold mb-4">Perfil</h5>
          <p class="text-muted small">Modifica tu nombre de usuario, correo o contraseña.</p>
          <button class="btn btn-dark w-100" (click)="openEditModal()">Editar perfil</button>
        </div>
      </div>

      <div class="col d-flex flex-column gap-3">
        <div class="card p-4">
          <span class="text-muted small">LÍMITE IA DIARIO</span>
          <div class="d-flex align-items-center gap-3 mt-2">
            <h2 class="fw-bold mb-0">{{ dailyUses() }} / 3</h2>
            <div class="flex-grow-1">
              <div class="progress" style="height: 8px">
                <div
                  class="progress-bar bg-dark"
                  [style.width]="((3 - dailyUses()) / 3) * 100 + '%'"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-12">
        <div class="card p-4">
          <h5 class="fw-bold mb-3">Estadísticas</h5>

          <div class="d-flex gap-4 mb-4">
            <div>
              <span class="text-muted small">ARTÍCULOS LEÍDOS</span>
              <h1 class="fw-bold mt-1">{{ totalArticlesRead() }}</h1>
            </div>
          </div>
          @for (item of generalData(); track item.category) {
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span style="width: 25%">{{ item.category }}</span>
              <div class="flex-grow-1 mx-3">
                <div class="progress" style="height: 6px">
                  <div class="progress-bar bg-dark" [style.width]="item.percentage + '%'"></div>
                </div>
              </div>
              <span class="text-muted small">{{ item.percentage }}%</span>
            </div>
          }
          <div class="d-flex justify-content-center">
            <app-stats-chart style="max-height: 300px; display: block"></app-stats-chart>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
