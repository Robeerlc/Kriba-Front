<div style="display: flex;">
    <div style="width: 280px; border-right: 1px solid #eee;">
        <lateralBar></lateralBar>
    </div>

    <div style="flex: 1; padding: 20px;">
        <!--Indice unico porque el back envia la misma noticias a veces-->
        @for (articulo of articles(); track $index) {
            <articlecard
                [article]="articulo"
                (aiSummary)="onAISummary($event)"
                (readFull)="onReadFull($event)">
            </articlecard>
        }
    </div>
</div>
