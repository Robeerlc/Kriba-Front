<div class="container-fluid mt-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex flex-wrap justify-content-center gap-2 pb-3 border-bottom">
        @for (cat of categorias; track cat) {
          <button
            (click)="cambiarCategoria(cat)"
            class="btn rounded-pill px-4 py-2 text-capitalize"
            [class.btn-dark]="categoriaSeleccionada === cat"
            [class.btn-outline-dark]="categoriaSeleccionada !== cat"
            [disabled]="isLoading"
          >
            {{ cat }}
          </button>
        }
      </div>
    </div>
  </div>

  <div class="row g-4">
    <aside class="col-12 col-md-4 col-lg-3 border-end">
      <lateralBar></lateralBar>
    </aside>

    <main
      class="col-12 col-md-8 col-lg-9"
      style="height: 80vh; overflow-y: auto"
      (scroll)="onScroll($event)"
    >
      <div class="d-flex flex-column gap-3">
       @for (articulo of visibleArticles(); track articulo.id) {
          <articlecard
            [article]="articulo"
            (aiSummary)="onAISummary($event)"
            (readFull)="onReadFull($event)"
            (subscriptionChanged)="onSubscriptionChanged($event)">
          </articlecard>
        }

        @if (isLoading) {
          <div style="text-align: center; padding: 20px">
            <div class="spinner"></div>
            <p>Cargando más noticias...</p>
          </div>
        }

        @if (!hasMore && visibleArticles().length > 0) {
          <div style="text-align: center; padding: 20px; color: #999">
            No hay más noticias en esta categoría
          </div>
        }
      </div>
    </main>
  </div>
</div>
