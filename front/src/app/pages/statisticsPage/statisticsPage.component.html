<div class="d-flex app-layout">
  <div class="sidebar-section">
    <lateralBar></lateralBar>
  </div>

  <div class="flex-grow-1 main-feed">
    <div class="container-responsive py-4">
      <h2 class="fw-bold">Estadísticas</h2>
      <p class="text-muted">Resumen de tu actividad de lectura</p>

      <div class="row">
        <div class="col-md-6">
          <div class="card p-3 h-100">
            <h5 class="fw-bold mb-3">Distribución por categoría</h5>
            <app-stats-chart></app-stats-chart>
          </div>
        </div>

        <div class="col-md-6 d-flex flex-column gap-3">
          <div class="card p-3">
            <span class="text-muted small">TOTAL ARTÍCULOS LEÍDOS</span>
            <h1 class="fw-bold mt-2">{{ totalArticlesRead() }}</h1>
          </div>

          <div class="card p-3">
            <h5 class="fw-bold mb-3">Top categorías</h5>
            @for (item of generalData(); track item.category) {
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span style="width: 25%">{{ item.category }}</span>
                <div style="width: 55%">
                  <div class="progress" style="height: 8px">
                    <div class="progress-bar bg-dark" [style.width]="item.percentage + '%'"></div>
                  </div>
                </div>
                <span class="text-muted small" style="width: 15%; text-align: right">
                  {{ item.percentage }}%
                </span>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
